name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without v prefix)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify plugin version matches package version
        run: |
          PV=$(node -p "require('./.claude-plugin/plugin.json').version")
          PJ=$(node -p "require('./package.json').version")
          if [ "$PV" != "$PJ" ]; then
            echo "❌ plugin.json version ($PV) != package.json version ($PJ)"
            exit 1
          fi
          echo "✅ versions match: $PV"

      - name: Validate CHANGELOG has release notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES=$(awk "/^## \[${VERSION}\]/{f=1; next} f && /^## \[/{exit} f" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "❌ CHANGELOG.md has no content under [${VERSION}]"
            exit 1
          fi
          echo "✅ CHANGELOG has release notes for ${VERSION}"

      - name: Verify git tag matches version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -n "$TAG" ] && [ "$TAG" != "v${VERSION}" ] && [ "$TAG" != "" ]; then
            # Allow workflow_dispatch (no tag) to proceed
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "❌ Tag $TAG does not match package.json version v${VERSION}"
              exit 1
            fi
          fi
          echo "✅ Tag matches version"

      - name: Verify kernel skill files present
        run: |
          for f in SKILL.md EXAMPLE.md REFORMULATIONS.md; do
            if [ ! -f "skills/engineering/kernel/$f" ]; then
              echo "❌ missing skills/engineering/kernel/$f"
              exit 1
            fi
          done
          echo "✅ all kernel files present"

  release:
    needs: validate
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if npm publish --provenance --access public 2>&1; then
              echo "✅ Published @codegiveness/kernel-skill (attempt ${attempt})"
              break
            elif [ "$attempt" -eq 3 ]; then
              echo "❌ Failed to publish after 3 attempts"
              exit 1
            else
              echo "⏳ Retrying in 15s..."
              sleep 15
            fi
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "${GITHUB_REF}" ]; then
            echo "workflow_dispatch: skipping GitHub Release (no tag)"
            exit 0
          fi
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{f=1; next} f && /^## \[/{exit} f" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          gh release create "$TAG" \
            --title "$TAG" --notes "$NOTES"
