name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (package.json + npm dry-run + skill files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Verify kernel-prompt skill files are present
        run: |
          for f in SKILL.md EXAMPLE.md REFORMULATIONS.md; do
            if [ ! -f "skills/engineering/kernel-prompt/$f" ]; then
              echo "❌ missing skills/engineering/kernel-prompt/$f"
              exit 1
            fi
            echo "✅ skills/engineering/kernel-prompt/$f present"
          done

      - name: Verify package.json name
        run: |
          NAME=$(node -p "require('./package.json').name")
          if [ "$NAME" != "@codegiveness/kernel-prompt" ]; then
            echo "❌ package name is $NAME, expected @codegiveness/kernel-prompt"
            exit 1
          fi
          echo "✅ package name is @codegiveness/kernel-prompt"

      - name: Verify naming consistency
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if [ "$PKG_NAME" != "@codegiveness/kernel-prompt" ]; then
            echo "❌ package.json name is $PKG_NAME, expected @codegiveness/kernel-prompt"
            exit 1
          fi
          echo "✅ package.json name is @codegiveness/kernel-prompt"

          PKG_BIN=$(node -p "JSON.stringify(require('./package.json').bin)")
          if [ "$PKG_BIN" != '{"kernel-prompt":"bin/kernel-prompt.mjs"}' ]; then
            echo "❌ package.json bin is $PKG_BIN, expected {\"kernel-prompt\":\"bin/kernel-prompt.mjs\"}"
            exit 1
          fi
          echo "✅ package.json bin is {\"kernel-prompt\":\"bin/kernel-prompt.mjs\"}"

          PLUGIN_NAME=$(node -p "require('./.claude-plugin/plugin.json').name")
          if [ "$PLUGIN_NAME" != "kernel-prompt" ]; then
            echo "❌ plugin.json name is $PLUGIN_NAME, expected kernel-prompt"
            exit 1
          fi
          echo "✅ plugin.json name is kernel-prompt"

          PLUGIN_SKILLS=$(node -p "require('./.claude-plugin/plugin.json').skills.includes('./skills/engineering/kernel-prompt')")
          if [ "$PLUGIN_SKILLS" != "true" ]; then
            echo "❌ plugin.json skills does not include ./skills/engineering/kernel-prompt, got: $PLUGIN_SKILLS"
            exit 1
          fi
          echo "✅ plugin.json skills includes ./skills/engineering/kernel-prompt"

          MARKETPLACE_NAME=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].name")
          if [ "$MARKETPLACE_NAME" != "kernel-prompt" ]; then
            echo "❌ marketplace.json first plugin name is $MARKETPLACE_NAME, expected kernel-prompt"
            exit 1
          fi
          echo "✅ marketplace.json first plugin name is kernel-prompt"

          SKILL_FM_NAME=$(grep -E "^name:" skills/engineering/kernel-prompt/SKILL.md | head -1 | sed 's/^name:[[:space:]]*//')
          if [ "$SKILL_FM_NAME" != "kernel-prompt" ]; then
            echo "❌ SKILL.md frontmatter name is '$SKILL_FM_NAME', expected kernel-prompt"
            exit 1
          fi
          echo "✅ SKILL.md frontmatter name is kernel-prompt"

          if ! grep -q 'const PKG = "@codegiveness/kernel-prompt"' bin/kernel-prompt.mjs; then
            echo "❌ bin/kernel-prompt.mjs missing 'const PKG = \"@codegiveness/kernel-prompt\"'"
            exit 1
          fi
          echo "✅ bin/kernel-prompt.mjs has const PKG = @codegiveness/kernel-prompt"

          if ! grep -q 'const SKILL_NAME = "kernel-prompt"' bin/kernel-prompt.mjs; then
            echo "❌ bin/kernel-prompt.mjs missing 'const SKILL_NAME = \"kernel-prompt\"'"
            exit 1
          fi
          echo "✅ bin/kernel-prompt.mjs has const SKILL_NAME = kernel-prompt"

          if ! grep -q "codegiveness/kernel-prompt" README.md; then
            echo "❌ README.md missing 'codegiveness/kernel-prompt'"
            exit 1
          fi
          echo "✅ README.md contains codegiveness/kernel-prompt"

          if ! grep -q "@codegiveness/kernel-prompt" README.md; then
            echo "❌ README.md missing '@codegiveness/kernel-prompt'"
            exit 1
          fi
          echo "✅ README.md contains @codegiveness/kernel-prompt"

          CHANGESET_REPO=$(node -p "require('./.changeset/config.json').changelog[1].repo")
          if [ "$CHANGESET_REPO" != "codegiveness/kernel-prompt" ]; then
            echo "❌ .changeset/config.json changelog repo is $CHANGESET_REPO, expected codegiveness/kernel-prompt"
            exit 1
          fi
          echo "✅ .changeset/config.json changelog repo is codegiveness/kernel-prompt"

          if ! grep -q 'NAME="kernel-prompt"' scripts/link-skills.sh; then
            echo "❌ scripts/link-skills.sh missing 'NAME=\"kernel-prompt\"'"
            exit 1
          fi
          echo "✅ scripts/link-skills.sh has NAME=kernel-prompt"

          if ! grep -q 'SRC="$REPO/skills/engineering/kernel-prompt"' scripts/link-skills.sh; then
            echo "❌ scripts/link-skills.sh missing 'SRC=\"$REPO/skills/engineering/kernel-prompt\"'"
            exit 1
          fi
          echo "✅ scripts/link-skills.sh has SRC=\$REPO/skills/engineering/kernel-prompt"

      - name: Verify plugin version matches package version
        run: |
          PV=$(node -p "require('./.claude-plugin/plugin.json').version")
          PJ=$(node -p "require('./package.json').version")
          if [ "$PV" != "$PJ" ]; then
            echo "❌ plugin.json version ($PV) != package.json version ($PJ)"
            exit 1
          fi
          echo "✅ versions match: $PV"

      - name: npm publish --dry-run
        run: npm publish --dry-run
