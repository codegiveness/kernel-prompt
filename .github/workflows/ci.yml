name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill discovery and installation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover skill with Skills CLI
        run: npx --yes skills@latest add . --list

      - name: Verify isolated Skills CLI installation
        env:
          DISABLE_TELEMETRY: "1"
        run: |
          SOURCE="$GITHUB_WORKSPACE"
          TEMP="$(mktemp -d)"
          trap 'rm -rf "$TEMP"' EXIT
          export HOME="$TEMP/home"
          mkdir -p "$HOME" "$TEMP/project"
          cd "$TEMP/project"
          npx --yes skills@latest add "$SOURCE" --skill kernel-prompt --agent codex --copy --yes
          cmp "$SOURCE/skills/kernel-prompt/SKILL.md" ".agents/skills/kernel-prompt/SKILL.md"
